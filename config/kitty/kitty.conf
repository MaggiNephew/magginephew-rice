# kitty -- monochrome rice (black / gray / white)

shell /usr/bin/bash
shell_integration enabled

font_family 3270 Nerd Font Mono
font_size 11.0

# --- monochrome palette ---
background #0d0d12
background_opacity 1.0
foreground #d5d5d5

color0  #1a1a1a
color1  #555555
color2  #6b6b6b
color3  #818181
color4  #979797
color5  #adadad
color6  #c3c3c3
color7  #d9d9d9

color8  #333333
color9  #666666
color10 #7c7c7c
color11 #929292
color12 #a8a8a8
color13 #bebebe
color14 #d4d4d4
color15 #ffffff

selection_foreground #0a0a0a
selection_background #888888

cursor #ffffff
cursor_text_color #0a0a0a

# --- copy/paste ---
copy_on_select clipboard
map ctrl+v paste_from_clipboard

# --- look & feel ---
window_padding_width 34
hide_window_decorations titlebar-only
remember_window_size no
initial_window_width 900
initial_window_height 550

# --- behaviour ---
scrollback_lines 10000
enable_audio_bell no
confirm_os_window_close 0

# --- tabs (bottom, monochrome) ---
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background #0d0d12
active_tab_background #d5d5d5
active_tab_foreground #0d0d12
active_tab_font_style bold
inactive_tab_background #1a1a1a
inactive_tab_foreground #888888

map ctrl+shift+t new_tab_with_cwd

# --- splits ---
enabled_layouts splits,stack
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+\ launch --location=vsplit --cwd=current
map ctrl+shift+' launch --location=hsplit --cwd=current
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down
# zoom the current split to full size and back
map ctrl+shift+z toggle_layout stack

# --- background shader (written by the `Shade` command, see ~/shade.sh) ---
include shader.conf

# emergency: turn the background shader off even if you can't see the terminal
map ctrl+shift+f12 launch --type=background ~/.local/bin/shade off

# let ctrl+shift+f reach programs (neovim: search in project)
map ctrl+shift+f no_op
