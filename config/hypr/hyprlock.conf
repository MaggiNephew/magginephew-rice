# hyprlock config -- monochrome rice
# sizes are in real pixels (display is scaled 1.6x)
# same look as the SDDM "mono" theme: black & white blocks, big clock, login card
# (previous version: hyprlock.conf.bak-20260928)

$font = 3270 Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
}

# black & white photo, dimmed so the text stays readable
background {
    monitor =
    path = ~/Pictures/wallpapers/lock-mono.jpg
    blur_passes = 0
    brightness = 0.65
    color = rgb(0a0a0a)
}

# ---- clock + date ----
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(ffffff)
    font_size = 135
    font_family = $font
    position = 0, 375
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %-d %B")"
    color = rgb(cccccc)
    font_size = 25
    font_family = $font
    position = 0, 250
    halign = center
    valign = center
}

# ---- login card ----
shape {
    monitor =
    size = 510, 375
    color = rgba(131313eb)
    rounding = 18
    border_size = 2
    border_color = rgb(999999)
    position = 0, -60
    halign = center
    valign = center
    zindex = 0
}

# avatar: initial in a circle
shape {
    monitor =
    size = 108, 108
    color = rgb(1f1f1f)
    rounding = -1
    border_size = 2
    border_color = rgb(333333)
    position = 0, 45
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:0] echo "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]'
    color = rgb(ffffff)
    font_size = 39
    font_family = $font
    position = 0, 45
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <b>$USER</b>
    color = rgb(e2e2e2)
    font_size = 21
    font_family = $font
    position = 0, -48
    halign = center
    valign = center
    zindex = 2
}

# password field (outline turns white while checking, "Wrong password" on failure)
input-field {
    monitor =
    size = 444, 69
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.25
    dots_center = true
    rounding = 12

    outer_color = rgb(999999)
    inner_color = rgb(111111)
    font_color = rgb(e2e2e2)
    check_color = rgb(ffffff)
    fail_color = rgb(777777)
    capslock_color = rgb(e2e2e2)

    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Password</span>
    fail_text = <span foreground="##ffffff">Wrong password</span>
    font_family = $font
    hide_input = false

    position = 0, -142
    halign = center
    valign = center
    zindex = 2
}

# caps-lock hint under the card
label {
    monitor =
    text = cmd[update:500] [ "$(cat /sys/class/leds/*::capslock/brightness 2>/dev/null | sort -r | head -1)" = 1 ] && echo "󰘲  Caps Lock is on" || echo ""
    color = rgb(999999)
    font_size = 16
    font_family = $font
    position = 0, -285
    halign = center
    valign = center
}
