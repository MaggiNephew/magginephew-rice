# hypridle config -- monochrome rice

general {
    # orbital-lock allows only one lock at a time by itself
    lock_cmd = $HOME/.local/bin/orbital-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# dim screen after 2.5 min
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# lock after 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# screen off after 5.5 min
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# suspend after 30 min (skipped while locked, so Super+L never sleeps)
listener {
    timeout = 1800
    on-timeout = $HOME/.local/bin/conditional-suspend
}
