# raw cava output for the quickshell visualizers (bar line + media popup)
# stereo: first half = left channel treble->bass, second half = right channel bass->treble
[general]
bars = 40
framerate = 30
autosens = 1

[output]
method = raw
channels = stereo
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
