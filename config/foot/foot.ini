[main]
font=3270 Nerd Font Mono:size=11
pad=12x12
dpi-aware=yes
selection-target=both
shell=/usr/bin/zsh

[scrollback]
lines=10000

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
background=0a0a0a
foreground=d5d5d5

regular0=1a1a1a
regular1=555555
regular2=6b6b6b
regular3=818181
regular4=979797
regular5=adadad
regular6=c3c3c3
regular7=d9d9d9

bright0=333333
bright1=666666
bright2=7c7c7c
bright3=929292
bright4=a8a8a8
bright5=bebebe
bright6=d4d4d4
bright7=ffffff

selection-foreground=0a0a0a
selection-background=888888

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v Control+v XF86Paste
primary-paste=Shift+Insert
