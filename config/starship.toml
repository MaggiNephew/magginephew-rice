"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](seg1)\
$os\
$username\
[](bg:seg2 fg:seg1)\
$directory\
[](fg:seg2 bg:seg3)\
$git_branch\
$git_status\
[](fg:seg3 bg:seg4)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:seg4 bg:seg5)\
$docker_context\
$conda\
$pixi\
[](fg:seg5 bg:seg6)\
$time\
[ ](fg:seg6)\
$line_break$character"""

palette = 'mono'

# monochrome rice — pills fade from white to near-black
[palettes.mono]
text_dark = '#0d0d12'   # text on the light pills (kitty background)
text_light = '#e6e6e6'  # text on the dark pills
seg1 = '#ffffff'        # os + user
seg2 = '#c4c4c4'        # directory
seg3 = '#8a8a8a'        # git
seg4 = '#505055'        # languages
seg5 = '#36363b'        # docker / conda
seg6 = '#242428'        # time
prompt_ok = '#9a9a9a'
prompt_err = '#ffffff'
prompt_vim = '#d5d5d5'

[os]
disabled = false
style = "bg:seg1 fg:text_dark"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:seg1 fg:text_dark"
style_root = "bg:seg1 fg:text_dark"
format = '[ $user ]($style)'

[directory]
style = "fg:text_dark bg:seg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:seg3"
format = '[[ $symbol $branch ](fg:text_dark bg:seg3)]($style)'

[git_status]
style = "bg:seg3"
format = '[[($all_status$ahead_behind )](fg:text_dark bg:seg3)]($style)'

[nodejs]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_light bg:seg4)]($style)'

[bun]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_light bg:seg4)]($style)'

[c]
symbol = " "
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_light bg:seg4)]($style)'

[cpp]
symbol = " "
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_light bg:seg4)]($style)'

[rust]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_light bg:seg4)]($style)'

[golang]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_light bg:seg4)]($style)'

[php]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_light bg:seg4)]($style)'

[java]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_light bg:seg4)]($style)'

[kotlin]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_light bg:seg4)]($style)'

[haskell]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_light bg:seg4)]($style)'

[python]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol( $version) ](fg:text_light bg:seg4)]($style)'

[docker_context]
symbol = ""
style = "bg:seg5"
format = '[[ $symbol( $context) ](fg:text_light bg:seg5)]($style)'

[conda]
style = "bg:seg5"
format = '[[ $symbol( $environment) ](fg:text_light bg:seg5)]($style)'

[pixi]
style = "bg:seg5"
format = '[[ $symbol( $version)( $environment) ](fg:text_light bg:seg5)]($style)'

[time]
disabled = false
time_format = "%-I:%M %p"
style = "bg:seg6"
format = '[[  $time ](fg:text_light bg:seg6)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:prompt_ok)'
error_symbol = '[](bold fg:prompt_err)'
vimcmd_symbol = '[](bold fg:prompt_vim)'
vimcmd_replace_one_symbol = '[](bold fg:prompt_vim)'
vimcmd_replace_symbol = '[](bold fg:prompt_vim)'
vimcmd_visual_symbol = '[](bold fg:seg2)'
