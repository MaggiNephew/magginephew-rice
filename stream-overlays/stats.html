<!doctype html>
<html><head><meta charset="utf-8"><title>Viewers and followers</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* browser source: 760 x 70.  Numbers come from Twitch (set up once with: stream-stats-setup) */
  body { display: flex; align-items: center; justify-content: center; }
  .bar {
    display: flex; align-items: center; gap: 22px;
    padding: 12px 22px;
    background: rgba(0, 0, 0, .78);
    border: 2px solid var(--white);
    border-radius: 3px;
  }
  .stat { display: flex; align-items: baseline; gap: 10px; }
  .num { font-family: var(--mono); font-size: 28px; color: var(--white); transition: transform .25s; }
  .num.bump { transform: scale(1.18); }
  .lbl { font-weight: 600; font-size: 11px; letter-spacing: .38em; color: var(--gray); }
  .sep { width: 2px; height: 26px; background: var(--dim); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); align-self: center; }
  .live .dot { background: var(--white); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .name { font-weight: 800; font-size: 18px; letter-spacing: .06em; color: var(--white);
          max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { transition: background .3s, box-shadow .3s; }
  .bar.new { background: rgba(255,255,255,.18); box-shadow: 0 0 24px rgba(255,255,255,.45); }
  .note { font-family: var(--mono); font-size: 13px; color: var(--gray); }
</style></head>
<body>
  <div class="bar" id="bar">
    <div class="stat"><div class="dot"></div><div class="num" id="viewers">–</div><div class="lbl" id="vlbl">WATCHING</div></div>
    <div class="sep"></div>
    <div class="stat"><div class="num" id="followers">–</div><div class="lbl">FOLLOWERS</div></div>
    <div class="sep"></div>
    <div class="stat"><div class="lbl">LATEST</div><div class="name" id="latest">–</div></div>
  </div>
  <script src="twitch-config.js" onerror="window.TWITCH = null"></script>
  <script src="test-listen.js"></script>
  <script>
    const cfg = window.TWITCH;
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + "K" : String(n);
    function set(id, n) {
      const el = $(id), v = fmt(n);
      if (el.textContent !== v) { el.textContent = v; el.classList.add("bump"); setTimeout(() => el.classList.remove("bump"), 260); }
    }
    function problem(msg) {
      $("bar").innerHTML = '<div class="note">' + msg + "</div>";
      console.log("[stats] " + msg);
    }
    async function api(path) {
      const r = await fetch("https://api.twitch.tv/helix/" + path, {
        headers: { "Client-Id": cfg.clientId, "Authorization": "Bearer " + cfg.token },
      });
      if (r.status === 401) throw new Error("auth");
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }
    async function refresh() {
      if (typeof testUntil !== "undefined" && Date.now() < testUntil) return;
      try {
        const [streams, follows] = await Promise.all([
          api("streams?user_id=" + cfg.userId),
          api("channels/followers?first=1&broadcaster_id=" + cfg.userId),
        ]);
        const live = streams.data && streams.data.length > 0;
        document.body.classList.toggle("live", live);
        set("viewers", live ? streams.data[0].viewer_count : 0);
        $("vlbl").textContent = live ? "WATCHING" : "OFFLINE";
        set("followers", follows.total || 0);
        const who = follows.data && follows.data[0] ? follows.data[0].user_name : "";
        if (who && who !== $("latest").textContent) {
          const first = $("latest").textContent === "–";
          $("latest").textContent = who;
          if (!first) {                 // a new follower since the overlay loaded: flash the bar
            $("bar").classList.add("new");
            setTimeout(() => $("bar").classList.remove("new"), 4000);
          }
        }
      } catch (e) {
        if (e.message === "auth") problem("twitch login expired — run stream-stats-setup");
        // network hiccups: keep the last numbers and try again next round
      }
    }
    // stream-test: follow [name] bumps the count + shows the name; stats shows sample numbers for 15 s
    let testUntil = 0;
    window.onStreamTest = (t) => {
      if ($("viewers") === null) return;           // showing a setup message instead of the bar
      testUntil = Date.now() + 15000;
      if (t.type === "follow") {
        const n = parseInt($("followers").textContent.replace(/\D/g, "")) || 0;
        set("followers", n + 1);
        $("latest").textContent = t.name || "TestFollower";
        $("bar").classList.add("new"); setTimeout(() => $("bar").classList.remove("new"), 4000);
      } else if (t.type === "stats") {
        document.body.classList.add("live");
        $("vlbl").textContent = "WATCHING";
        set("viewers", t.viewers ?? 42);
        set("followers", t.followers ?? 1234);
        $("latest").textContent = t.name || "TestFollower";
      }
      setTimeout(() => { if (Date.now() >= testUntil && cfg && cfg.token) refresh(); }, 15100);
    };
    if (!cfg || !cfg.token) problem("not set up yet — run stream-stats-setup");
    else { refresh(); setInterval(refresh, 30000); }
  </script>
</body></html>
