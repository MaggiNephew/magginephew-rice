<!doctype html>
<html><head><meta charset="utf-8"><title>Logo badge</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* browser source size: 440 x 130 -- sits in a corner while you're live */
  body { display: flex; align-items: center; justify-content: center; }
  .box { background: rgba(0,0,0,.72); padding: 14px 18px 22px; border-radius: 4px; }
  .frame { width: 380px; padding: 16px 18px 20px; --stroke: 3px; --gap: 136px; }
  .frame .label { font-size: 10px; letter-spacing: .36em; text-indent: .36em; }
</style></head>
<body>
  <div class="box"><div class="frame"><img class="wordmark" src="wordmark.svg" alt="MAGGINEPHEW"><div class="label">GENESIS 1:27</div></div></div>
</body></html>
